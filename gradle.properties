org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 full mode. Off by default in AGP; on here because the shrink it does not attempt in compat
# mode — class merging, unused-argument removal, and assuming a class with no visible allocation
# is never instantiated — is most of the win on a phone this slow to cold-start.
#
# The rule of thumb when a full-mode build breaks: a `-keep` on a class no longer implies keeping
# its members.
android.enableR8.fullMode=true
