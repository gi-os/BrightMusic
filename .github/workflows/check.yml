name: Check

# A push to `main` builds, signs and publishes a release, so there was nowhere to find
# out whether something compiles without also shipping it. This runs on every other
# branch and does exactly that and nothing else — no signing, no APK, no release.
# Same shape as the check workflow in the sibling Light* repos.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  # light-common resolves from GitHub Packages, which has no anonymous read.
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # The Rust core is cross-compiled with cargo-ndk, so the NDK has to be present
      # before Gradle's preBuild fires scripts/build-rust.sh.
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # build-rust.sh does a *host* build to generate the UniFFI bindings, and that
      # build uses default features: rodio -> cpal -> alsa-sys. The runner therefore
      # needs ALSA headers even though the shipped Android build uses the AudioTrack
      # sink and never touches ALSA.
      - name: Install ALSA headers for the host bindings build
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/spotify-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/spotify-core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      # Debug only. The release build is the thing that would produce a shippable APK,
      # and the point of this job is that it never does.
      - name: Compile
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # The release job runs these before it builds, so a failing test there means a
      # release that did not happen and a main branch already pushed. Running them here
      # too is the whole point of a job that proves a change without shipping it.
      - name: Unit tests
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace
