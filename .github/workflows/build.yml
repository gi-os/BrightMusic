name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # light-common resolves from GitHub Packages, which has no anonymous read.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # The Rust core is cross-compiled with cargo-ndk, so the NDK has to be
      # present before Gradle's preBuild fires scripts/build-rust.sh.
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # scripts/build-rust.sh does a *host* build to generate the UniFFI bindings
      # (the stripped Android .so has no metadata). The host build uses default
      # features, which pulls rodio -> cpal -> alsa-sys, so the runner needs ALSA
      # headers even though the shipped Android build uses the AudioTrack sink and
      # never touches ALSA. Without this, cargoBuild dies with
      # "failed to run custom build command for alsa-sys".
      - name: Install ALSA headers for the host bindings build
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      # rust-toolchain.toml pins the channel and both Android targets, so this
      # picks them up without repeating the target list here.
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/spotify-core/target
          # librespot is pinned to =0.8.0 and patched locally, so the lockfile is
          # a reliable cache key.
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/spotify-core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      # Signing is MANDATORY and must never silently fall back. A release APK signed
      # with a runner's throwaway debug keystore installs once and then fails every
      # update with Obtainium's "Failure: Invalid", and an unsigned one cannot install
      # at all — both have shipped silently in sibling repos before. Fail loudly here
      # instead.
      - name: Require signing material
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "Refusing to build: an unsigned or debug-signed release cannot be updated in place."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          echo "Wrote keystore.properties ($(stat -c%s release.jks) byte keystore)"

      # versionCode is the workflow run number so `adb install -r` upgrades in
      # place rather than erroring on a downgrade.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${RUN}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Unit tests
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          # Scoped to issues:write on gi-os/light-reports and nothing else.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Android identifies an app by (packageName, signing certificate). A drifting
      # certificate shows up only as "Failure: Invalid" at install time, days later, so
      # pin it and fail here instead. Note the sed: apksigner prints
      # "Signer #1 certificate SHA-256 digest: <hex>", so splitting on ': ' grabs the
      # label rather than the hex.
      - name: Verify the signing certificate has not drifted
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' | head -1 \
            | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' \r' | tr 'A-F' 'a-f')
          EXPECTED=$(tr -d ' \n\r:' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ -z "$ACTUAL" ]; then echo "::error::APK is not signed at all"; exit 1; fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed — installs would fail with 'Invalid'."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          NAME="BrightMusic-v${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightMusic-apk
          path: ${{ steps.apk.outputs.name }}

      # One APK per release, and only on main. Obtainium picks an asset by pattern, so
      # publishing a debug build alongside the release one lets it choose either.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: BrightMusic v${{ steps.ver.outputs.version }}
          make_latest: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            Automated build from `${{ github.sha }}`.

            `versionCode` is the workflow run number (${{ github.run_number }}), so this
            upgrades an installed build in place.

            **First install needs one adb grant** for colour album art:

            ```
            adb shell pm grant com.lightphone.spotify android.permission.WRITE_SECURE_SETTINGS
            ```

            Without it covers stay greyscale — nothing else changes. Text entry also needs a
            system IME on the device (`adb shell ime list -s`); see the README.
