name: Deploy setup page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "setup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This workflow had never once run: its triggers are `setup/**` and this file, and neither had
      # changed since it was added — so the SHA-pinning pass was the first thing that ever fired it,
      # and it failed on "Get Pages site failed... verify that the repository has Pages enabled and
      # configured to build using GitHub Actions". Pages simply was not switched on for this repo.
      # Nothing depended on it — the README sends people to the upstream project's setup page — so
      # it had been failing silently by never running at all.
      #
      # Pages is enabled now, with the source set to GitHub Actions, which is a repository setting
      # rather than anything in this file. `enablement: true` was tried here first and cannot work:
      # creating a Pages site needs repository admin and the workflow token does not have it —
      # "Create Pages site failed. Error: Resource not accessible by integration". If this ever
      # fails the same way again, the fix is in Settings → Pages, not here.
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: setup

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
